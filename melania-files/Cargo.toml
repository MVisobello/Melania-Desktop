[package]
name = "melania-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
melania-config = { path = "../melania-config" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
melania-transfer = { path = "../melania-transfer" }

melania-files-core = { path = "../melania-files-core" }

# Small, explicit image format surface; decode is off the GTK thread.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
