[package]
name = "melania-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "renderer_gl", "wayland_frontend", "desktop"] }
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
wayland-protocols = { version = "0.32", features = ["server"] }
melania-core = { path = "../melania-core" }
melania-dnd = { path = "../melania-dnd" }
melania-shell-model = { path = "../melania-shell-model" }

melania-control = { path = "../melania-control" }

melania-workspaces = { path = "../melania-workspaces" }

melania-config = { path = "../melania-config" }
