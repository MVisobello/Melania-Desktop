permissions:
  contents: read

# QEMU TCG boots are expensive. Replacing a pull-request commit cancels only
# its superseded test run, never unrelated branches or the main push check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-kms:
    name: Rust melania-native KMS TEST_ONLY in isolated VirtIO GPU guest
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate fail-closed native VM harness
        run: |
          set -euo pipefail
          bash -n scripts/melania-qemu-native-guest.sh
          bash -n scripts/run-qemu-melania-native.sh
          bash -n scripts/melania-native-physical-preflight.sh
          python3 -m unittest discover -s tests -p 'test_qemu_native_stage17.py' -v
          python3 -m unittest discover -s tests -p 'test_native_rollback_stage19.py' -v
          python3 -m unittest discover -s tests -p 'test_native_fb2_stage21.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_visible_scanout.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_wayland_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_shell_stage25.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_client_pixel_stage26.py' -v
          python3 -m unittest discover -s tests -p 'test_native_output_stage27.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_rust_kms_stage28.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_live_kms_stage29.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_presented_frame_stage30.py' -v
          python3 -m unittest discover -s tests -p 'test_native_scene_stage31.py' -v
          python3 -m unittest discover -s tests -p 'test_native_render_scheduler_stage32.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_two_windows_stage33.py' -v
          python3 -m unittest discover -s tests -p 'test_native_async_kms_stage34.py' -v
          python3 -m unittest discover -s tests -p 'test_native_window_input_stage35.py' -v
          python3 -m unittest discover -s tests -p 'test_native_window_interactions_stage36.py' -v
          python3 -m unittest discover -s tests -p 'test_native_drag_kms_stage38.py' -v
          python3 -m py_compile scripts/inject-qemu-window-drag.py
          python3 -m py_compile scripts/capture-qemu-drag-frame.py
          python3 -m py_compile scripts/inject-qemu-dynamic-pointer.py
          python3 -m py_compile scripts/inject-qemu-authenticated-resize.py
          python3 -m py_compile scripts/inject-qemu-alt-tab.py
          python3 -m py_compile scripts/inject-qemu-edge-drop.py
          python3 -m unittest discover -s tests -p 'test_native_edge_drop_qemu_stage121.py' -v
          python3 -m py_compile scripts/capture-qemu-dynamic-pointer.py
          python3 -m unittest discover -s tests -p 'test_qemu_dynamic_pointer_frame13.py' -v
          python3 -m py_compile scripts/capture-qemu-managed-xdg-roles.py
          python3 -m py_compile scripts/capture-qemu-real-layer-panel.py
          python3 -m py_compile scripts/capture-qemu-real-gtk-panel.py
          python3 -m py_compile scripts/export-qemu-real-gtk-png.py
          python3 -m unittest discover -s tests -p 'test_qemu_gtk_png_evidence.py' -v
          python3 -m py_compile tools/build_qemu_fluent_subset.py
          python3 -m unittest discover -s tests -p 'test_qemu_fluent_icon_bundle.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_gtk_fluent_lookup.py' -v
          python3 -m py_compile scripts/capture-qemu-real-gtk-two-frames.py
          python3 -m unittest discover -s tests -p 'test_qemu_real_gtk_two_frames_stage85.py' -v
          python3 -m py_compile scripts/capture-qemu-real-gtk-start-overlay.py
          python3 -m unittest discover -s tests -p 'test_qemu_real_gtk_start_overlay_stage86.py' -v
          python3 -m py_compile scripts/inject-qemu-real-gtk-super-start.py
          python3 -m unittest discover -s tests -p 'test_qemu_real_gtk_super_stage87.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_gtk_start_search_stage88.py' -v
          python3 -m unittest discover -s tests -p 'test_native_seat_revocation_stage89.py' -v
          python3 -m unittest discover -s tests -p 'test_native_libinput_scroll_stage90.py' -v
          python3 -m unittest discover -s tests -p 'test_native_extended_frames_stage91.py' -v
          python3 -m unittest discover -s tests -p 'test_native_resource_recovery_stage92.py' -v
          python3 -m unittest discover -s tests -p 'test_native_kms_restore_stage93.py' -v
          python3 -m unittest discover -s tests -p 'test_native_output_dispatch_stage94.py' -v
          python3 -m unittest discover -s tests -p 'test_native_kernel_scanout_stage95.py' -v
          python3 -m unittest discover -s tests -p 'test_native_shared_kernel_scanout_stage96.py' -v
          python3 -m unittest discover -s tests -p 'test_native_one_process_kms.py' -v
          python3 -m unittest discover -s tests -p 'test_native_layer_panel_qmp.py' -v
          python3 -m unittest discover -s tests -p 'test_native_xdg_qmp_role_pixels.py' -v
          python3 -m unittest discover -s tests -p 'test_native_authenticated_resize_qemu_stage114.py' -v
          python3 -m unittest discover -s tests -p 'test_native_alt_tab_qemu_stage116.py' -v
          python3 -m py_compile scripts/capture-qemu-live-kms-stream.py
          python3 -m py_compile scripts/capture-qemu-two-windows.py
          python3 -m py_compile scripts/capture-qemu-rust-kms-frames.py
          python3 -m py_compile scripts/capture-qemu-client-window.py
          python3 -m py_compile scripts/inject-qemu-native-input.py
          python3 -m py_compile scripts/inject-qemu-two-window-focus.py
          python3 -m py_compile scripts/capture-qemu-visible-scanout.py
      - name: Build actual Rust backend on same Ubuntu release as guest
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libudev-dev libseat-dev \
            libdrm-dev libgbm-dev libinput-dev qemu-system-x86 \
            qemu-utils cloud-image-utils genisoimage curl \
            libgtk-4-dev wayland-protocols meson ninja-build
          cargo test -p melania-native --all-targets
          # Ubuntu 24.04 has GTK4 headers but no gtk4-layer-shell C dev package.
          # Build pinned upstream v1.1.1 from source, with nonessential
          # introspection / docs / tests disabled; verify Git revision.
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/melania-gtk4-layer-shell
          test "$(git -C /tmp/melania-gtk4-layer-shell rev-parse HEAD)" = \
            "4867d7b85cdf1e829fc1fd6f1d5f04c42cc99389"
          meson setup /tmp/melania-gtk4-layer-shell/build \
            /tmp/melania-gtk4-layer-shell \
            --prefix=/usr/local -Dintrospection=false -Dvapi=false \
            -Dtests=false -Dsmoke-tests=false -Ddocs=false -Dexamples=false
          ninja -C /tmp/melania-gtk4-layer-shell/build
          sudo ninja -C /tmp/melania-gtk4-layer-shell/build install
          sudo ldconfig
          export PKG_CONFIG_PATH="/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # Stage83B preflight: compile the actual panel, not a mock client.
          pkg-config --modversion gtk4 gtk4-layer-shell-0
          cargo build -p melania-panel --bin melania-panel
          # Only the small, already approved original Fluent SVG set enters
          # the sacrificial guest ISO. Full distributions use a separate pack.
          # Rust cache can restore a stale target/melania-qemu-fluent-icons
          # directory. Generate this VM-only fixture at a fresh, uncached
          # runner-local location and preserve the builder's no-overwrite guard.
          fluent_staging="$(mktemp -d "${RUNNER_TEMP}/melania-qemu-fluent.XXXXXXXX")"
          fluent_icons="$fluent_staging/icons"
          python3 tools/build_qemu_fluent_subset.py --output "$fluent_icons"
          python3 tools/build_qemu_fluent_subset.py --verify-only --output "$fluent_icons"
          printf 'MELANIA_QEMU_FLUENT_ICONS_DIR=%s\n' "$fluent_icons" >> "$GITHUB_ENV"
          test -x target/debug/melania-panel
          ldd target/debug/melania-panel | tee gtk-panel-runtime-libs.txt
          if grep -q 'not found' gtk-panel-runtime-libs.txt; then
            echo 'MELANIA_NATIVE_GTK_PANEL_LINK_READY=false'
            exit 1
          fi
          echo 'MELANIA_NATIVE_GTK_PANEL_LINK_READY=true'
          # Copy the resolved SONAME file, not a symlink broken by ISO9660.
          layer_libdir="$(pkg-config --variable=libdir gtk4-layer-shell-0)"
          layer_soname="$(readlink -e "$layer_libdir/libgtk4-layer-shell.so.0")"
          test -s "$layer_soname"
          install -m 0644 "$layer_soname" target/debug/melania-gtk4-layer-shell.so.0
          test -s target/debug/melania-gtk4-layer-shell.so.0
          cargo build -p melania-native --bins
          test -x target/debug/qemu-layer-panel-client
          test -x target/debug/qemu-gtk-five-roles
          test -x target/debug/qemu-authenticated-resize-client
          test -x target/debug/qemu-super-snap-client
          test -x target/debug/qemu-edge-drop-client
          test -x target/debug/qemu-shell-client
          test -x target/debug/qemu-client-window
          test -x target/debug/qemu-rust-kms-frames
          test -x target/debug/qemu-rust-kms-stream
          # GETFB2 may return new GEM handles. Prove every handle is closed
          # on the same fd, inside the sacrificial VM (never on the runner).
          cc -O2 -Wall -Wextra -Werror -std=c11 \
            -I/usr/include/libdrm scripts/melania-qemu-fb2-probe.c \
            -o target/debug/melania-qemu-fb2-probe -ldrm
          test -x target/debug/melania-qemu-fb2-probe
          cc -O2 -Wall -Wextra -Werror -std=c11 \
            -I/usr/include/libdrm scripts/melania-qemu-visible-frame.c \
            -o target/debug/melania-qemu-visible-probe -ldrm
          test -x target/debug/melania-qemu-visible-probe
          cc -O2 -Wall -Wextra -Werror -std=c11 \
            -I/usr/include/libdrm scripts/melania-qemu-client-window-scanout.c \
            -o target/debug/melania-qemu-client-window-scanout -ldrm
          test -x target/debug/melania-qemu-client-window-scanout
          cc -O2 -Wall -Wextra -Werror -std=c11 \
            scripts/melania-qemu-wayland-client.c \
            -o target/debug/melania-qemu-wayland-client -lwayland-client
          test -x target/debug/melania-qemu-wayland-client
          ldd target/debug/melania-native | tee native-runtime-libs.txt
          test -x target/debug/melania-native
      - name: Boot QEMU guest and execute REAL binary against virtual DRM card
        env:
          MELANIA_QEMU_NATIVE_VM: YES_DISPOSABLE_QEMU
          MELANIA_QEMU_NATIVE_REPORT_DIR: reports/qemu-native
        run: bash scripts/run-qemu-melania-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-real-melania-native-evidence
          path: |
            reports/qemu-native/
            native-runtime-libs.txt
            gtk-panel-runtime-libs.txt
          if-no-files-found: warn
