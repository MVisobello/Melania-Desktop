name: Build Melania Aero icon themes

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_melania_icon_variants.py'
      - 'tools/audit_melania_icon_variants.py'
      - 'branding/coverage/**'
      - 'branding/Melania-Aero-Classic/**'
      - 'branding/Melania/**'
      - '.github/workflows/melania-icons.yml'
  pull_request:
    paths:
      - 'tools/build_melania_icon_variants.py'
      - 'branding/coverage/**'
      - 'branding/Melania-Aero-Classic/**'
      - 'branding/Melania/**'
      - '.github/workflows/melania-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon-themes:
    name: Validate and package Melania Light / Dark / Light on Dark Panel
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build all three original icon variants
        run: |
          set -euo pipefail
          python3 tools/build_melania_icon_variants.py --output dist/melania-icon-themes
          find dist/melania-icon-themes -type l | wc -l
      - name: Validate all reference paths and variants
        run: |
          set -euo pipefail
          python3 tools/build_melania_icon_variants.py --verify --output dist/melania-icon-themes
          test -f dist/melania-icon-themes/Melania-Light/index.theme
          test -f dist/melania-icon-themes/Melania-Dark/index.theme
          test -f dist/melania-icon-themes/Melania-Light-on-Dark-Panel/index.theme
      - name: Audit artwork diversity and resolved icon aliases
        run: |
          set -euo pipefail
          python3 tools/audit_melania_icon_variants.py --output dist/melania-icon-themes --report dist/melania-icon-audit.json
      - name: Verify isolated user-local installation
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/melania-icons-isolated
        run: |
          set -euo pipefail
          bash scripts/install-melania-icon-variants.sh dist/melania-icon-themes
          test -f "$XDG_DATA_HOME/icons/Melania-Dark/places/scalable/folder.svg"
          test -f "$XDG_DATA_HOME/icons/Melania-Light/actions/24/edit-copy.svg"
          test -f "$XDG_DATA_HOME/icons/Melania-Light-on-Dark-Panel/panel/network-wireless-signal-excellent.svg"
      - name: Export portable packages
        run: |
          set -euo pipefail
          cd dist/melania-icon-themes
          tar -cf ../Melania-Aero-Complete.tar .
          cd ..
          xz -T2 -6 Melania-Aero-Complete.tar
          ls -lh Melania-Aero-Complete.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: Melania-Aero-Icon-Themes
          path: |
            dist/Melania-Aero-Complete.tar.xz
            dist/melania-icon-audit.json
          if-no-files-found: error
