name: QEMU GLES stage triage self-tests

on:
  pull_request:
    paths:
      - 'scripts/triage-qemu-gles-stages.py'
      - '.github/workflows/qemu-gles-stage-triage.yml'
  push:
    paths:
      - 'scripts/triage-qemu-gles-stages.py'
      - '.github/workflows/qemu-gles-stage-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-triage-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed GLES stage parser regressions
        run: python3 scripts/triage-qemu-gles-stages.py --self-test
