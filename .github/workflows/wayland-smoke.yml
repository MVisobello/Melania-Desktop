name: Melania nested Wayland smoke test

on:
  push:
    branches: [main]
    paths:
      - 'melania-compositor/**'
      - 'melania-control/**'
      - 'melania-files/**'
      - 'melania-panel/**'
      - 'tools/build_melania_icon_variants.py'
      - 'tools/build_melania_fluent_themes.py'
      - 'tools/melania_shell_symbolic_icons.py'
      - 'tests/test_appearance_trio_shell_icons.py'
      - 'tests/test_start_menu_tray_design.py'
      - 'tools/melania_fluent_artwork.py'
      - 'tools/melania_fluent_reference.py'
      - 'branding/window-chrome-win7.css'
      - 'branding/window_controls.rs'
      - 'tools/check_shared_window_chrome.py'
      - 'melania-settings/**'
      - 'branding/coverage/**'
      - 'melania-desktop-surface/**'
      - 'scripts/smoke-nested-wayland.sh'
      - 'scripts/smoke-full-desktop-wayland.sh'
      - '.github/workflows/wayland-smoke.yml'
  pull_request:
    paths:
      - 'tools/build_melania_fluent_themes.py'
      - 'tools/melania_shell_symbolic_icons.py'
      - 'tests/test_appearance_trio_shell_icons.py'
      - 'tests/test_start_menu_tray_design.py'
      - 'tools/melania_fluent_artwork.py'
      - 'tools/melania_fluent_reference.py'
      - 'branding/window-chrome-win7.css'
      - 'branding/window_controls.rs'
      - 'tools/check_shared_window_chrome.py'
      - 'melania-settings/**'
      - 'melania-compositor/**'
      - 'melania-control/**'
      - 'melania-shell-model/**'
      - 'melania-files/**'
      - 'melania-panel/**'
      - 'melania-desktop-surface/**'
      - 'scripts/smoke-nested-wayland.sh'
      - 'scripts/smoke-full-desktop-wayland.sh'
      - '.github/workflows/wayland-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-wayland:
    name: Xvfb host + real nested Wayland compositor + GTK client
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software rendering, GTK and X11 host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential xvfb xauth x11-utils \
            libwayland-dev libxkbcommon-dev libgtk4-layer-shell-dev \
            libegl1-mesa-dev libgles2-mesa-dev libx11-dev libudev-dev \
            libseat-dev libdrm-dev libgbm-dev libdbus-1-dev libgtk-4-dev \
            libgl1-mesa-dri mesa-utils scrot python3-pil procps dbus dbus-user-session dbus-x11
      - name: Build nested compositor, control CLI and GTK file manager
        run: |
          set -o pipefail
          cargo build -p melania-compositor -p melania-control -p melania-files -p melania-panel -p melania-desktop-surface -p melania-settings 2>&1 | tee wayland-smoke-build.log
      - name: Install the selected Fluent icon family into isolated CI data directory
        run: |
          set -euo pipefail
          python3 tools/build_melania_fluent_themes.py --output dist/melania-fluent-icons
          XDG_DATA_HOME="${RUNNER_TEMP}/melania-data" bash scripts/install-melania-fluent-icons.sh dist/melania-fluent-icons
          test -f "${RUNNER_TEMP}/melania-data/icons/Melania-Fluent-Light/places/scalable/folder.svg"
          test -f "${RUNNER_TEMP}/melania-data/icons/Melania-Fluent-Light/apps/scalable/computer.svg"
      - name: Run real nested session (no host session takeover)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          WINIT_UNIX_BACKEND: x11
          KEEP_MELANIA_LOGS: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/melania-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/melania-config
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          mkdir -p reports
          xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
            timeout --signal=TERM --kill-after=5s 85s \
            bash scripts/smoke-nested-wayland.sh 2>&1 | tee wayland-smoke-test.log
      - name: Full desktop session, screenshot, workspace IPC and clean shutdown
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          WINIT_UNIX_BACKEND: x11
          RUST_BACKTRACE: '1'
          MELANIA_DEBUG_RENDER: '1'
          WAYLAND_DEBUG: client
          GSK_RENDERER: cairo
          XDG_DATA_HOME: ${{ runner.temp }}/melania-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/melania-config
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
            timeout --signal=TERM --kill-after=5s 95s \
            bash scripts/smoke-full-desktop-wayland.sh 2>&1 | tee wayland-full-test.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melania-nested-wayland-smoke-logs
          path: |
            wayland-smoke-*.log
            reports/wayland-smoke.log
            reports/wayland-full-*.log
            reports/nested-wayland-full-desktop.png
            reports/nested-wayland-file-preview.bmp
          if-no-files-found: warn
