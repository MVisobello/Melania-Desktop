name: Melania Settings GNOME UI visual check

on:
  pull_request:
    paths:
      - 'melania-settings/**'
      - 'melania-files/assets/style.css'
      - 'melania-files/src/main.rs'
      - 'branding/window-chrome-win7.css'
      - 'tools/melania_fluent_office.py'
      - 'tools/build_melania_fluent_themes.py'
      - '.github/workflows/settings-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-visual:
    name: Build and capture actual GTK4 Settings window
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4 and X11 virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev xvfb xauth scrot dbus-x11 python3-pil
      - name: Build the real Settings application
        run: cargo build -p melania-settings
      - name: Prepare Fluent icons in isolated user folder
        env:
          XDG_DATA_HOME: \${{ runner.temp }}/melania-data
        run: |
          python3 tools/build_melania_fluent_themes.py --output dist/melania-fluent-icons
          bash scripts/install-melania-fluent-icons.sh dist/melania-fluent-icons
      - name: Capture system and appearance pages from live GTK
        env:
          GDK_BACKEND: x11
          XDG_DATA_HOME: \${{ runner.temp }}/melania-data
          XDG_CONFIG_HOME: \${{ runner.temp }}/melania-config
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
        run: |
          mkdir -p reports
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -euc '
            target/debug/melania-settings system &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 4
            kill -0 $pid
            scrot -q 92 reports/settings-system-gtk.png
            target/debug/melania-settings appearance
            sleep 2
            kill -0 $pid
            scrot -q 92 reports/settings-appearance-gtk.png
          '
          python3 - <<'PY'
          from PIL import Image, ImageStat
          for name in ("system", "appearance"):
              path=f"reports/settings-{name}-gtk.png"
              with Image.open(path) as im:
                  assert im.size == (1280, 800), (path, im.size)
                  assert ImageStat.Stat(im.convert("RGB")).stddev[0] > 7, "Capture appears blank"
                  print(path, im.size, ImageStat.Stat(im).stddev)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melania-gnome-settings-live-gtk
          path: reports/settings-*-gtk.png
          if-no-files-found: warn
