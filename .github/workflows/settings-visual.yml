name: Melania Settings GNOME UI visual check

on:
  pull_request:
    paths:
      - 'melania-settings/**'
      - 'melania-files/assets/style.css'
      - 'melania-files/src/main.rs'
      - 'branding/window-chrome-win7.css'
      - 'branding/window_controls.rs'
      - 'tools/melania_fluent_office.py'
      - 'tools/build_melania_fluent_themes.py'
      - '.github/workflows/settings-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-visual:
    name: Build and capture actual GTK4 Settings window
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4 and X11 virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev xvfb xauth scrot dbus-x11 python3-pil
      - name: Build the real Settings application
        run: cargo build -p melania-settings
      - name: Prepare Fluent icons in isolated user folder
        env:
          XDG_DATA_HOME: \${{ runner.temp }}/melania-data
        run: |
          python3 tools/build_melania_fluent_themes.py --output dist/melania-fluent-icons
          bash scripts/install-melania-fluent-icons.sh dist/melania-fluent-icons
      - name: Capture system and appearance pages from live GTK
        env:
          GDK_BACKEND: x11
          XDG_DATA_HOME: \${{ runner.temp }}/melania-data
          XDG_CONFIG_HOME: \${{ runner.temp }}/melania-config
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
        run: |
          mkdir -p reports
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -euc '
            target/debug/melania-settings system &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 4
            kill -0 $pid
            # A healthy GTK process may need longer than four seconds to
            # paint its first Xvfb frame (especially with software GL).
            # Retry *capturing*, not launching, to avoid a false black shot.
            capture_ready() {
              path="$1"
              for attempt in $(seq 1 18); do
                scrot -q 92 "$path"
                if python3 -c "import sys; from PIL import Image,ImageStat; im=Image.open(sys.argv[1]).convert(\"RGB\"); sys.exit(0 if ImageStat.Stat(im).stddev[0]>7 else 1)" "$path"; then
                  echo "GTK screenshot ready: $path (attempt $attempt)"
                  return 0
                fi
                sleep 1
              done
              echo "FAIL: GTK never painted a nonblack frame for $path" >&2
              return 1
            }
            capture_ready reports/settings-system-gtk.png
            target/debug/melania-settings appearance
            sleep 2
            kill -0 $pid
            capture_ready reports/settings-appearance-gtk.png
            # Inspect the new XFCE coverage overview in the REAL GTK app.
            target/debug/melania-settings xfce
            sleep 2
            kill -0 $pid
            capture_ready reports/settings-xfce-gtk.png
            target/debug/melania-settings xfce-preferred
            sleep 2
            kill -0 $pid
            capture_ready reports/settings-xfce-preferred-gtk.png
          '
          python3 - <<'PY'
          from PIL import Image, ImageStat
          for name in ("system", "appearance", "xfce", "xfce-preferred"):
              path=f"reports/settings-{name}-gtk.png"
              with Image.open(path) as im:
                  assert im.size == (1280, 800), (path, im.size)
                  assert ImageStat.Stat(im.convert("RGB")).stddev[0] > 7, "Capture appears blank"
                  print(path, im.size, ImageStat.Stat(im).stddev)
          PY
      - name: Capture Light, Dark and Aero as real GTK appearance screenshots
        env:
          GDK_BACKEND: x11
          XDG_DATA_HOME: ${{ runner.temp }}/melania-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/melania-config
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          set -euo pipefail
          mkdir -p reports "$XDG_CONFIG_HOME/melania"
          for theme in light dark aero; do
            case "$theme" in
              light) dark=false; aero=false ;;
              dark) dark=true; aero=false ;;
              aero) dark=false; aero=true ;;
            esac
            printf 'dark_mode=%s\naero_glass=%s\n' "$dark" "$aero" > "$XDG_CONFIG_HOME/melania/settings.conf"
            export MELANIA_CAPTURE_THEME="$theme"
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -euc '
              target/debug/melania-settings appearance &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              sleep 3
              for attempt in $(seq 1 20); do
                kill -0 $pid
                scrot -q 92 "reports/settings-theme-${MELANIA_CAPTURE_THEME}.png"
                if python3 -c "import sys; from PIL import Image,ImageStat; im=Image.open(sys.argv[1]).convert(\"RGB\"); sys.exit(0 if ImageStat.Stat(im).stddev[0]>7 else 1)" "reports/settings-theme-${MELANIA_CAPTURE_THEME}.png"; then
                  echo "Real GTK ${MELANIA_CAPTURE_THEME} theme painted on attempt $attempt"
                  exit 0
                fi
                sleep 1
              done
              echo "No valid ${MELANIA_CAPTURE_THEME} screenshot" >&2
              exit 1
            '
          done
          python3 - <<'PY'
          from PIL import Image
          images={name:Image.open(f'reports/settings-theme-{name}.png').convert('RGB')
                  for name in ('light','dark','aero')}
          for name,im in images.items():
              assert im.size==(1280,800),name
          # A real GNOME-inspired dark page must be substantially darker.
          def brightness(im): return sum(im.getpixel((x,y))[0] for x in (580,750,910) for y in (250,410,550))/9
          assert brightness(images['dark'])+35 < brightness(images['light']), 'Dark theme still paints light content'
          print('PASS: real Light, Dark, Aero Settings renders', {k:brightness(v) for k,v in images.items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melania-gnome-settings-live-gtk
          path: reports/settings-*.png
          if-no-files-found: warn
